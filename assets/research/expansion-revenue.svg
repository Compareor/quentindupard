<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Retention illustration placeholder">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4a5cf5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#35d6ee" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="b1" cx="18%" cy="14%" r="55%">
      <stop offset="0" stop-color="#4a5cf5" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4a5cf5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b2" cx="84%" cy="82%" r="55%">
      <stop offset="0" stop-color="#35d6ee" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#35d6ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#eef1fb"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <rect width="1200" height="630" fill="url(#b1)"/>
  <rect width="1200" height="630" fill="url(#b2)"/>

  <!-- glass pane -->
  <g>
    <rect x="120" y="115" width="960" height="400" rx="34" fill="#ffffff" fill-opacity="0.30"/>
    <rect x="120" y="115" width="960" height="400" rx="34" fill="url(#sheen)"/>
    <rect x="120.5" y="115.5" width="959" height="399" rx="33.5" fill="none" stroke="#0d1424" stroke-opacity="0.10"/>
  </g>

  <text x="600" y="330" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif"
        font-size="40" font-weight="600" letter-spacing="-1.2"
        fill="#0d1424" fill-opacity="0.34">Retention</text>
  <text x="600" y="374" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif"
        font-size="16" letter-spacing="0.6"
        fill="#0d1424" fill-opacity="0.24">Image placeholder</text>
</svg>
