# Cloudflare Worker (Workers Builds, `npx wrangler deploy`).
#
# The site is static files plus a handful of API routes. Workers serves the
# files through the [assets] binding and src/index.js handles everything under
# /api/ plus the two permanently-removed URLs.

name = "quentindupard"
main = "src/index.js"
compatibility_date = "2026-08-26"

# The Anthropic SDK needs Node built-ins on the Workers runtime.
compatibility_flags = ["nodejs_compat"]

# Keep the site on one origin. Left to default these are true, which would
# publish an identical copy at quentindupard.workers.dev and split SEO.
workers_dev = false
preview_urls = false

[assets]
directory = "."
binding = "ASSETS"
# Serve /404.html for unmatched paths rather than a bare Worker error.
not_found_handling = "404-page"
# Let the Worker see requests first so /api/* and the 410s are handled.
run_worker_first = ["/api/*", "/services", "/services/", "/contact", "/contact/"]

# ── Counters for /stats, and the ask rate limit ──────────────
# Create these in the dashboard (Storage & Databases -> KV), then paste the ids.
[[kv_namespaces]]
binding = "STATS"
id = "002d98d00fc348b6aa970612c9e295d9"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "6e4d8954df9e4b359d0fb2972e014541"

# ── Full event stream ────────────────────────────────────────
# Analytics Engine must be ENABLED on the account before this deploys — a
# disabled dataset fails the whole build with error 10089, it does not
# degrade. The binding name must match env.ANALYTICS in track.js and the
# dataset must match the one created in the dashboard.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "qd_events"

# ── Custom domain ────────────────────────────────────────────
# Declared here, not just in the dashboard. wrangler reconciles routes from
# this file: the first deploy log showed it was about to REMOVE the custom
# domain because the file did not mention it.
[[routes]]
pattern = "quentindupard.com"
custom_domain = true

# Secrets, not vars. Set them with:
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put ADMIN_PASSWORD
# or in the dashboard under Settings -> Variables and Secrets.
#
# ADMIN_PASSWORD gates /admin. It also signs the session cookie, so changing it
# signs out every open editor session. Without it set, /admin cannot be
# unlocked at all and the site quietly serves its baked-in content.
